name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ng test --watch=false

      # Pages serves project sites from /<repo>/, so the app needs that as its base href.
      # Skipped on pull requests, which only verify that the app builds.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        run: pnpm ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      # Pages has no server-side routing: unknown paths like /listing/<id> get 404.html.
      # Serving the app shell there lets the Angular router handle deep links and reloads.
      - name: SPA fallback for deep links
        run: cp dist/ng-building-list/browser/index.html dist/ng-building-list/browser/404.html

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/ng-building-list/browser

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment halfway; queue the next one instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
